# Caching front for the Rozna thermometer board (192.168.1.200). The board is a 10 Mbit ENC28J60
# with one 1150 B buffer and must never see visitor traffic directly: visitors get cached copies,
# at most 2 upstream connections are ever open, and only the board's own six URLs are proxied.
proxy_cache_path /dev/shm/thermo-cache levels=1 keys_zone=thermo:1m max_size=8m inactive=1h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=thermo_rl:1m rate=5r/s;

upstream thermo_board {
    zone thermo_board 64k;
    server 192.168.1.200:80 max_conns=2;
}

server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    # Only the local tunnel connects here; it sends the visitor address in CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    limit_req zone=thermo_rl burst=20 nodelay;
    limit_req_status 429;

    # ASSET_VER in the sketch is a small number; anything else is not a request the board's page makes.
    if ($arg_v !~ "^[0-9]{0,3}$") { return 400; }

    location = /list.json {
        include snippets/thermo-proxy.conf;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10s;
    }
    location = / {
        include snippets/thermo-proxy.conf;
        proxy_cache_key $uri;
        proxy_cache_valid 200 60s;
    }
    location ~ ^/(main\.css|main\.js|det\.js|favicon\.svg)$ {
        include snippets/thermo-proxy.conf;
        proxy_cache_key $uri$arg_v;
        proxy_cache_valid 200 10m;
    }
    location / { return 404; }
}
